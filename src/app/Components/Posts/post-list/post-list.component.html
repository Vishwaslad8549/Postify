<div class="post-grid">
<div class="post-card" *ngFor="let post of Posts">
    <img
      [src]="post.imagePath"
      alt="User Photo"
      class="post-photo"
      (click)="openImage(post.imagePath)"
    />
    <div class="post-info">
      <h3>{{ post.content }}</h3>
      
      <div class="actions">
        <button class="btn-update" (click)="onEdit(post.id)">Update</button>
        <button class="btn-delete" (click)="onDelete(post.id)">Delete</button>
      </div>
    </div>
  </div>
  <div
    class="image-modal"
    *ngIf="selectedImage"
    (click)="closeImage()"
  >
    <img [src]="selectedImage" alt="Enlarged Image" />
  </div>
</div>

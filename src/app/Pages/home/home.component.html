  <div class="home-container">
    <!-- Hero Section -->
    <div class="hero">
      <h1 class="title animate-fade-in">Welcome to Postify</h1>
      <br>
      <p class="subtitle animate-slide-up">Share your stories and moments with the world.</p>
      <button mat-raised-button color="primary" class="animate-bounce" (click)="OnGetstarted()">Get Started</button>
    </div>
  
    <!-- Features Section -->
    <div class="features">
      <div class="feature-item animate-zoom-in">
        <img src="assets/image1.jpg" alt="Feature 1" />
        <h2>Share Images</h2>
        <p>Upload and share your favorite moments with friends and family.</p>
      </div>
      <div class="feature-item animate-zoom-in">
        <img src="assets/image2.jpg" alt="Feature 2" />
        <h2>Post Content</h2>
        <p>Express yourself with engaging posts and stories.</p>
      </div>
      <div class="feature-item animate-zoom-in">
        <img src="assets/image3.jpg" alt="Feature 3" />
        <h2>Connect</h2>
        <p>Build your network and stay connected with your community.</p>
      </div>
    </div>
  </div>
  <router-outlet></router-outlet>
  <div class="home-footer">
    <app-footer></app-footer>
  </div>
